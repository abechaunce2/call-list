.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}

.cnt{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.empty{color:var(--muted);font-size:13px;padding:12px 14px}
.done{opacity:.38}
.sold .nm{text-decoration:line-through}

 dev[d]=s;localStorage.setItem(SKEY(bid),JSON.stringify(dev));
 toast(status==="notnow"?"Not interested — removed":status+" saved ✓");render();
}
function fup3(bid,d){
 let dt=new Date();let add=3;while(add>0){dt.setDate(dt.getDate()+1);const w=dt.getDay();if(w!==0&&w!==6)add--;}
 const iso=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")+"T10:00";
 setStatus(bid,d,"followup",iso);
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1500)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
 const secData={};SECS.forEach(([k])=>secData[k]=[]);
 let total=0;
 BOOKS.forEach(b=>{
  if(!bookOn[b.id])return;
  const st=mergedState(b);
  b.rows.forEach(r=>{
   const d=digits(r.p);const s=st[d];
   const cls=classify(r,s);if(!cls)return;
   if(cls.sec!=="sold")total++;
   secData[cls.sec].push({b,r,s,emailed:cls.emailed});
  });
 });
 const secs=document.getElementById("sections");secs.innerHTML="";
 SECS.forEach(([key,label])=>{
  const items=secData[key];
  if(key==="sold"||key==="overdue"||key==="today"||key==="emailed"||items.length){
   const lab=document.createElement("div");lab.className="lab";lab.textContent=label+" ("+items.length+")";secs.appendChild(lab);
   const card=document.createElement("div");card.className="card";
   if(key==="sold"){TROPHIES.forEach(t=>{const tv=document.createElement("div");tv.className="row sold";tv.innerHTML='<div class="nm">'+t.label+'<span class="bdg" style="background:'+t.color+'">'+t.badge+'</span></div>';card.appendChild(tv)});}
   if(!items.length&&key!=="sold"){card.innerHTML='<div class="empty">Nothing here ✓</div>';}
   if(key==="emailed"){items.sort((a,b2)=>callInfo(a.s).last-callInfo(b2.s).last)}
   else{items.sort((a,b2)=>{const ta=a.s&&a.s.time?new Date(a.s.time).getTime():callInfo(a.s).last;const tb=b2.s&&b2.s.time?new Date(b2.s.time).getTime():callInfo(b2.s).last;return ta-tb})}
   items.forEach(({b,r,s,emailed})=>{
    const div=document.createElement("div");div.className="row";
    const d=digits(r.p);
    if(key==="sold"){div.classList.add("sold");
     div.innerHTML='<div class="nm">'+esc(r.n.replace(/\[[^\]]*\]/g,"").trim())+'<span class="bdg" style="background:'+b.color+'">'+b.badge+'</span></div>';
     card.appendChild(div);return;}
    const rc=recentcall(s);
    if(rc)div.classList.add("done");
    const ci=callInfo(s);
    const nm=esc(r.n.replace(/\[[^\]]*\]/g,"").replace(/[⭐🎯🔥⏰]/g,"").trim());
    let html='<div class="nm">'+nm+'<span class="bdg" style="background:'+b.color+'">'+b.badge+'</span>'+(emailed?'<span class="chip">✉ emailed</span>':"")+(ci.n?'<span class="cnt2">'+ci.n+"× · last "+fdate(ci.last)+'</span>':"")+(rc?'<span class="chip">✓ called '+rc+'</span>':"")+'</div>';
    html+='<div class="meta"><a class="ph" href="tel:'+d+'">'+r.p+'</a> · '+esc(r.t||"")+(s&&s.time?' · due '+ftime(s.time):'')+'</div>';
    if(s&&s.notes)html+='<div class="note">'+esc(s.notes)+'</div>';
    if(r.e)html+='<div class="meta">✉ '+esc(r.e)+'</div>';
    html+='<div class="acts">'+
     '<button onclick="setStatus(\''+b.id+'\',\''+d+'\',\'noanswer\')">📵 No answer</button>'+
     '<button onclick="setStatus(\''+b.id+'\',\''+d+'\',\'leftmsg\')">💬 Left message</button>'+
     '<button onclick="setStatus(\''+b.id+'\',\''+d+'\',\'callback\')">↩ Call back</button>'+
     '<button onclick="fup3(\''+b.id+'\',\''+d+'\')">📅 Follow up in 3 days</button>'+
     '<button onclick="setStatus(\''+b.id+'\',\''+d+'\',\'notnow\')">🚫 Not interested</button>'+
     '<button onclick="setStatus(\''+b.id+'\',\''+d+'\',\'won\')">🏆 SOLD</button>'+
    '</div>';
    div.innerHTML=html;card.appendChild(div);
   });
   secs.appendChild(card);
  }
 });
 document.getElementById("counts").textContent=total+" warm threads · "+secData.overdue.length+" overdue · "+secData.today.length+" due today · "+secData.emailed.length+" emailed waiting";
 const chips=document.getElementById("bookChips");chips.innerHTML="";
 BOOKS.forEach(b=>{
  const merged=mergedState(b);const has=Object.keys(merged).length;
  if(!has)return;
  const c=document.createElement("button");c.className="bchip"+(bookOn[b.id]?" on":"");
  c.style.borderColor=b.color;c.textContent=b.badge+" ("+has+")";
  c.onclick=()=>{bookOn[b.id]=!bookOn[b.id];render()};chips.appendChild(c);
 });
}
document.getElementById("copyBtn").onclick=async function(){
 const out={exported:new Date().toISOString(),multi:true,source:"well-v2",books:{}};
 BOOKS.forEach(b=>{const m=mergedState(b);if(Object.keys(m).length)out.books[b.id]=m});
 const txt=JSON.stringify(out);
 try{await navigator.clipboard.writeText(txt);toast("Copied all books ✓ — email it over")}
 catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Copied ✓")}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();
</script></body></html>
